<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="light dark">
	<title>Carl Ejlers</title>

	<!-- This address only forwards. The portfolio lives on carlejlers.dk, and
	     that is the one address search engines should list. -->
	<link rel="canonical" href="https://www.carlejlers.dk/">
	<meta name="robots" content="noindex, follow">

	<!-- The path, query and fragment travel along, so a deep link still lands
	     on the right page. -->
	<script>
		location.replace('https://www.carlejlers.dk' + location.pathname + location.search + location.hash);
	</script>

	<!-- Without scripting the front page is the fallback. -->
	<meta http-equiv="refresh" content="0; url=https://www.carlejlers.dk/">
</head>

<body>
	<p><a href="https://www.carlejlers.dk/">carlejlers.dk</a></p>
</body>

</html>
